services:
  eucerin-ml-api:
    build: .
    ports:
      - '10000:10000'
    environment:
      APP_MODE: research
      ML_API_KEY: ${ML_API_KEY:?Create local .env with ML_API_KEY}
      MODEL_DIR: /app/models
      STORAGE_DIR: /app/storage
      PORT: '10000'
    volumes:
      - eucerin_state:/app/storage
volumes:
  eucerin_state:
